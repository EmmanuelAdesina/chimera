name: Protect Main Branch

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  pull_request_review:
    types: [submitted]

jobs:
  # 1. Check if PR is from contributor branch
  check-contributor:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check branch source
        run: |
          if [[ "${{ github.head_ref }}" != contributor/* ]]; then
            echo "❌ PRs must come from contributor/* branches only"
            exit 1
          fi
          echo "✅ PR from contributor branch"

  # 2. Require review approval
  require-review:
    runs-on: ubuntu-latest
    needs: check-contributor
    if: github.event_name == 'pull_request_review'
    steps:
      - name: Check review status
        run: |
          if [[ "${{ github.event.review.state }}" != "approved" ]]; then
            echo "❌ PR needs approval before merging"
            exit 1
          fi
          echo "✅ PR approved"

  # 3. Prevent direct pushes to main (except from maintainer)
  prevent-direct-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check actor
        run: |
          if [[ "${{ github.actor }}" != "EmmanuelAdesina" ]]; then
            echo "❌ Only EmmanuelAdesina can push directly to main"
            exit 1
          fi
          echo "✅ Maintainer push allowed"

  # 4. Run tests before allowing merge
  run-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          pytest tests/ -v
      - name: Run linting
        run: |
          ruff check chimera/
          mypy chimera/