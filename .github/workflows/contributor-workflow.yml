name: Contributor Workflow

on:
  push:
    branches:
      - 'contributor/*'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest tests/ -v

  # Auto-create PR when pushing to contributor branch
  create-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/contributor/')
    steps:
      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head ${{ github.ref_name }} \
            --title "Contributor: ${{ github.ref_name }}" \
            --body "Automated PR from ${{ github.ref_name }}. Ready for review." \
            --reviewer EmmanuelAdesina