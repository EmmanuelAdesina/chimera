[metadata]
name = "chimera"
version = "0.1.0"
description = "Causal security reasoning engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
"openai>=1.0",
"anthropic>=0.30",
"networkx>=3.0",
"tree-sitter>=0.22",
"tree-sitter-python>=0.21",
"requests>=2.31",
"pydantic>=2.0",
"chromadb>=0.5",
"pytest>=8.0",
]
[project.optional-dependencies]
dev = ["black", "ruff", "mypy", "pytest-cov"]
[tool.setuptools.packages.find]
where = ["."]
include = ["chimera*"]
