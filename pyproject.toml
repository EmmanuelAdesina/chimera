[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera"
version = "2.1.0"
description = "Closed-loop causal reasoning engine for offensive security"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Chimera Author"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Core engine runs on the standard library alone. Optional planes are extras.
dependencies = []

[project.optional-dependencies]
vector = [
    "chromadb>=0.5",       # Semantic memory backend (falls back to in-memory keyword search)
]
http = [
    "aiohttp>=3.9",        # Caido GraphQL bridge (chimera.plugins.caido_bridge)
]
browser = [
    "playwright>=1.40",    # Browser layer (manual install: playwright install chromium)
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.0",
]

[project.scripts]
chimera = "chimera.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.setuptools.packages.find]
where = ["."]
include = ["chimera*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
